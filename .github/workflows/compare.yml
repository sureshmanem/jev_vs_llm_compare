# Offline tests on every push and PR (free). The live comparison spends
# OpenRouter credit (~$4.50 for a full run), so it only runs on demand:
# Actions -> compare -> Run workflow.
name: compare

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      args:
        description: "jev-compare arguments (empty = both tasks, all engines, 3 repeats, ~$4.50)"
        default: "--limit 3 --repeats 1"
        required: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -r requirements.txt
      - run: pytest

  live:
    if: github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_API_KEY != '' }}
      LANGSMITH_PROJECT: jev-vs-llm-compare
      ARGS: ${{ inputs.args }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Without the key Jev silently falls back to the offline simulator.
      - name: Check OpenRouter key
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "::error::Add OPENROUTER_API_KEY under Settings -> Secrets and variables -> Actions"
            exit 1
          fi
      - run: pip install -r requirements.txt
      # Clear the committed results so only this run's files are reported.
      # ARGS is unquoted on purpose so it splits into separate arguments.
      - run: |
          rm -rf results
          jev-compare $ARGS
      - name: Add summary to the run page
        if: always()
        run: cat results/*.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ github.run_id }}
          path: results/
          if-no-files-found: ignore
