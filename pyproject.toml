[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-compare"
version = "0.1.0"
description = "Jev (typed classifier) vs LLM on the same loan-eligibility decision."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "langsmith>=0.1.100",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Jev's SDK is distributed by TypeSafe AI, not PyPI; install it from their instructions.
jev = ["langchain-typesafe>=0.1"]
dev = ["pytest>=8"]

[project.scripts]
jev-compare = "jev_compare.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
