[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-compare"
version = "0.1.0"
description = "Jev (TypeSafe System One) vs LLMs on the same labelled decisions: claims triage and loan eligibility."
requires-python = ">=3.10"
dependencies = [
    "typesafe-sdk>=0.7",      # Jev (TypeSafe System One), direct or via OpenRouter
    "httpx2>=2.13",           # HTTP client the SDK uses; also used for OpenRouter chat calls
    "langsmith>=0.1.100",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-compare = "jev_compare.compare:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
